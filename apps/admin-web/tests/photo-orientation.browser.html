<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>실물 사진 회전 검증</title>
<style>body{font:16px system-ui;margin:32px}pre{white-space:pre-wrap}button{padding:12px}</style>
<h1>실물 사진 회전 검증</h1>
<button id="run">픽셀·치수·AI 입력 검증 실행</button>
<pre id="results">대기</pre>
<script type="module">
import { rotateLandscapePhoto } from '../src/lib/photoOrientation.js';
import { prepareStudioImagePayload } from '../src/lib/studioClient.js';
const results = document.querySelector('#results');
const assert = (condition, message) => { if (!condition) throw new Error(message); };
async function fixture(width, height) {
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  const pixels = ctx.createImageData(width, height);
  for (let i = 0; i < width * height; i++) {
    pixels.data.set([(i * 17) % 256, (i * 23) % 256, (i * 31) % 256, 255], i * 4);
  }
  ctx.putImageData(pixels, 0, 0);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  return { file: new File([blob], 'physical.png', { type: 'image/png' }), pixels: pixels.data };
}
// 휴대폰으로 찍은 표지처럼 바탕 무늬·잡음·글자가 섞인 가로 JPEG
async function photoFixture(width, height) {
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createLinearGradient(0, 0, width, height);
  gradient.addColorStop(0, '#f4efe6'); gradient.addColorStop(1, '#c9d6e8');
  ctx.fillStyle = gradient; ctx.fillRect(0, 0, width, height);
  const pixels = ctx.getImageData(0, 0, width, height);
  let seed = 7;
  for (let i = 0; i < pixels.data.length; i += 4) for (let c = 0; c < 3; c++) {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    pixels.data[i + c] = Math.max(0, Math.min(255, pixels.data[i + c] + (seed % 25) - 12));
  }
  ctx.putImageData(pixels, 0, 0);
  ctx.fillStyle = '#111'; ctx.font = `${Math.round(height / 12)}px sans-serif`;
  for (let row = 1; row <= 8; row++) ctx.fillText('수능특강 국어 독서 2027 수북 SUBOOK', width * 0.05, row * height / 9);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
  return new File([blob], 'IMG_1234.JPG', { type: 'image/jpeg' });
}
// 2026-11-24 이전 방식(회전본을 PNG로 보관)으로 저장했을 때의 용량
async function legacyPngSize(file) {
  const bitmap = await createImageBitmap(file);
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.height; canvas.height = bitmap.width;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(0, 1, -1, 0, bitmap.height, 0); ctx.drawImage(bitmap, 0, 0); bitmap.close();
  return (await new Promise(resolve => canvas.toBlob(resolve, 'image/png'))).size;
}
const mb = bytes => `${(bytes / 1048576).toFixed(2)}MB`;
async function decode(file) {
  const bitmap = await createImageBitmap(file);
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width; canvas.height = bitmap.height;
  const ctx = canvas.getContext('2d'); ctx.drawImage(bitmap, 0, 0);
  const output = { width: bitmap.width, height: bitmap.height, pixels: ctx.getImageData(0, 0, bitmap.width, bitmap.height).data };
  bitmap.close(); return output;
}
document.querySelector('#run').onclick = async () => {
  results.textContent = '검증 중';
  const passed = [];
  try {
    const source = await fixture(71, 29);
    const rotated = await rotateLandscapePhoto(source.file);
    const image = await decode(rotated);
    assert(image.width === 29 && image.height === 71, '임의 비율의 폭/높이 맞교환 실패');
    for (let y = 0; y < 29; y++) for (let x = 0; x < 71; x++) {
      const from = (y * 71 + x) * 4;
      const to = (x * 29 + (28 - y)) * 4;
      for (let c = 0; c < 4; c++) assert(source.pixels[from+c] === image.pixels[to+c], `원본 픽셀 변경 ${x},${y},${c}`);
    }
    passed.push('PASS 임의 비율 71×29 → 29×71, 2,059개 픽셀 RGBA 전체 동일 (시계 90도)');
    assert(await rotateLandscapePhoto(rotated) === rotated, '중복 회전 발생');
    assert(rotated.type === 'image/png' && rotated.name === 'physical_portrait.png', 'PNG 원본의 무손실 보관 실패');
    passed.push('PASS 이미 회전한 세로 원본은 재회전·재압축 없음, PNG 원본은 PNG 그대로');
    for (const [w,h] of [[40,60],[40,40]]) {
      const {file} = await fixture(w,h);
      assert(await rotateLandscapePhoto(file) === file, '세로/정사각 원본 변경');
    }
    passed.push('PASS 세로·정사각 입력 File 원본 유지');
    const large = await fixture(3000,1500);
    const largeResult = await decode(await rotateLandscapePhoto(large.file));
    assert(largeResult.width === 1500 && largeResult.height === 3000, '실물 크기 축소 발생');
    passed.push('PASS 3000×1500 → 1500×3000, 크롭·리사이즈 없음');
    // JPG 사진은 회전본도 JPEG로 저장한다. 위치는 그대로, 화질 손실은 눈에 띄지 않는 범위여야 한다.
    const W = 4000, H = 3000;
    const photo = await photoFixture(W, H);
    const before = await decode(photo);
    const rotatedPhoto = await rotateLandscapePhoto(photo);
    assert(rotatedPhoto.type === 'image/jpeg' && rotatedPhoto.name === 'IMG_1234_portrait.jpg', `JPEG 저장 실패: ${rotatedPhoto.type} ${rotatedPhoto.name}`);
    const after = await decode(rotatedPhoto);
    assert(after.width === H && after.height === W, 'JPEG 회전본 폭/높이 맞교환 실패');
    let sum = 0, max = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const from = (y * W + x) * 4;
      const to = (x * H + (H - 1 - y)) * 4;
      for (let c = 0; c < 3; c++) {
        const diff = Math.abs(before.pixels[from+c] - after.pixels[to+c]);
        sum += diff; if (diff > max) max = diff;
      }
    }
    const mean = sum / (W * H * 3);
    assert(mean <= 2, `JPEG 회전본 화질 손실 과다: 평균 ${mean.toFixed(2)}/255`);
    const pngSize = await legacyPngSize(photo);
    assert(rotatedPhoto.size < pngSize / 2, `JPEG 회전본이 충분히 작지 않음: ${mb(rotatedPhoto.size)} vs PNG ${mb(pngSize)}`);
    assert(await rotateLandscapePhoto(rotatedPhoto) === rotatedPhoto, 'JPEG 회전본 중복 회전 발생');
    passed.push(`PASS 가로 JPEG ${W}×${H}(${mb(photo.size)}) → ${H}×${W} JPEG ${mb(rotatedPhoto.size)} (PNG로 보관하면 ${mb(pngSize)}), 색 오차 평균 ${mean.toFixed(2)}/255·최대 ${max}`);
    const prepared = await prepareStudioImagePayload(source.file, {rotateLandscape:true});
    const upload = await (await fetch(`data:${prepared.mimeType};base64,${prepared.imageBase64}`)).blob();
    const modelInput = await decode(upload);
    assert(modelInput.width === 29 && modelInput.height === 71, 'AI 입력 회전 실패');
    passed.push('PASS AI에도 회전한 세로 이미지를 전달');
    results.textContent = passed.join('\n') + '\nALL PASS';
  } catch (error) { results.textContent = passed.join('\n') + '\nFAIL: ' + error.message; }
};
</script>
</html>
