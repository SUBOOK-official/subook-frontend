<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5C"/>
      <stop offset="100%" stop-color="#2D5F8E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="180" fill="#ffffff" opacity="0.06"/>
  <circle cx="150" cy="550" r="220" fill="#ffffff" opacity="0.04"/>

  <!-- Logo badge -->
  <g transform="translate(80, 80)">
    <rect width="80" height="80" rx="16" fill="url(#accent)"/>
    <text x="40" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="44" font-weight="900" fill="#1B3A5C" text-anchor="middle">수</text>
  </g>

  <!-- Brand -->
  <text x="180" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="42" font-weight="900" fill="#ffffff">SUBOOK</text>
  <text x="180" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="600" fill="#fbbf24" letter-spacing="4">수북</text>

  <!-- Main title -->
  <text x="80" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="72" font-weight="900" fill="#ffffff">다 쓴 수능 교재,</text>
  <text x="80" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="72" font-weight="900" fill="#fbbf24">합리적인 가격에.</text>

  <!-- Subtitle -->
  <text x="80" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="500" fill="#cbd5e1">수거 · 검수 · 판매 · 정산을 한 번에</text>

  <!-- Footer line -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="80" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="600" fill="#ffffff" opacity="0.7">subook.kr — 수능 교재 위탁판매 플랫폼</text>
</svg>
