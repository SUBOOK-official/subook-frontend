<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#080F47" />

    <title>수북 | 수능을 위한 가장 똑똑한 선택</title>
    <meta
      name="description"
      content="당신의 수험이, 다음 사람의 시작이 됩니다. 전문 검수를 마친 새 수능 교재, 대치동 교재, 실전 모의고사를 저렴한 가격에 판매합니다."
    />
    <!-- 구글은 keywords를 무시하지만 네이버 등 국내 검색 대비 유지 (구 식스샵 설정 이관) -->
    <meta
      name="keywords"
      content="수북, subook, 수능, 교재, 책, 중고, 대치동, 거래, 중고 거래, 중고 교재, 수능 중고 교재, 대입, 입시, 수능 교재"
    />
    <!-- 네이버 서치어드바이저 소유확인 태그 — 삭제 시 소유권 풀림, 절대 제거 금지 -->
    <meta name="naver-site-verification" content="6cd153a2d1482d0033ef63dbc700426dd61f3450" />
    <!-- 도메인 전환(식스샵→신규) SEO: 정식 도메인 기준 canonical — temp 도메인 중복 색인 방지 -->
    <link rel="canonical" href="https://subook.kr/" />

    <!-- Open Graph (카카오톡 / 페이스북 등 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="수북 | 수능을 위한 가장 똑똑한 선택" />
    <meta
      property="og:description"
      content="당신의 수험이, 다음 사람의 시작이 됩니다. 전문 검수를 마친 새 수능 교재, 대치동 교재, 실전 모의고사를 저렴한 가격에 판매합니다."
    />
    <meta property="og:site_name" content="수북 SUBOOK" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://subook.kr/" />
    <meta property="og:image" content="https://subook.kr/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="수북 | 수능을 위한 가장 똑똑한 선택" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="수북 | 수능을 위한 가장 똑똑한 선택" />
    <meta
      name="twitter:description"
      content="당신의 수험이, 다음 사람의 시작이 됩니다. 전문 검수를 마친 새 수능 교재, 대치동 교재, 실전 모의고사를 저렴한 가격에 판매합니다."
    />
    <meta name="twitter:image" content="https://subook.kr/og-image.png" />

    <!-- Font: 본문은 LINE Seed KR로 통일. 로고는 이미지 자산으로 교체되어 별도 폰트 불필요.
         CSS @import 대신 link로 로드해 렌더 블로킹을 줄인다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/npm/@kfonts/line-seed-sans-kr/index.min.css"
    />
    <!-- Favicon (새 브랜드 심볼 — 책+별) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Organization 구조화 데이터 — 브랜드 검색 결과용 (도메인은 최종 도메인 기준) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "수북 (SUBOOK)",
        "url": "https://subook.kr",
        "logo": "https://subook.kr/og-image.png",
        "description": "수험생을 위한 수능 교재 위탁판매 플랫폼 — 수거·검수·판매·정산까지.",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "email": "subook2025@gmail.com",
          "availableLanguage": "Korean"
        }
      }
    </script>
    <!-- WebSite 구조화 데이터 — '수북' 브랜드 검색어와 사이트 연관 강화 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "수북",
        "alternateName": ["SUBOOK", "수북 SUBOOK"],
        "url": "https://subook.kr"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- JS 미실행 크롤러(특히 네이버 Yeti) 폴백 — SPA 빈 화면 방지용 정적 브랜드 콘텐츠 -->
    <noscript>
      <main>
        <h1>수북 SUBOOK — 수능 교재 위탁판매 플랫폼</h1>
        <p>
          수북(SUBOOK)은 수험생을 위한 수능 교재 위탁판매 플랫폼입니다. 안 쓴 수능
          교재를 무료 방문 수거로 보내면 전문 검수를 거쳐 판매하고, 판매된 금액은
          매월 정산해 드립니다. 검수를 통과한 새 책 수준의 수능특강·수능완성·기출
          문제집 등 수능 교재를 합리적인 가격에 구매할 수도 있습니다.
        </p>
        <ul>
          <li><a href="/store">교재 스토어 — 검수된 수능 교재 구매</a></li>
          <li><a href="/pickup/new">수거 신청 — 안 쓴 교재 판매하기</a></li>
          <li><a href="/faq">자주 묻는 질문</a></li>
          <li><a href="/notices">공지사항</a></li>
        </ul>
        <p>이 사이트는 JavaScript가 필요한 서비스입니다. 브라우저에서 JavaScript를 활성화해 주세요.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
