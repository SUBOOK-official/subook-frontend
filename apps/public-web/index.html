<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#080F47" />

    <!-- Google tag (gtag.js) — GA4 수집. SPA 라우트 전환 page_view는 향상된 측정
         (브라우저 방문 기록 이벤트)이 자동 처리, 전자상거래 이벤트는 src/lib/analytics.js -->
    <script>
      // 운영 방문만 수집한다. 로컬·preview·PG 심사·추적 거부 환경은 태그 자체를 로드하지 않는다.
      if (location.origin === "https://subook.kr" && navigator.globalPrivacyControl !== true &&
          new URLSearchParams(location.search).get("pg_review_mode") !== "true") {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        gtag("js", new Date());
        gtag("config", "G-EMNCLZKPMS", { send_page_view: false });
        var gaScript = document.createElement("script");
        gaScript.async = true;
        gaScript.src = "https://www.googletagmanager.com/gtag/js?id=G-EMNCLZKPMS";
        document.head.appendChild(gaScript);
      }
    </script>

    <!-- Meta 픽셀은 main.jsx에서 운영 도메인·빌드 확인 후 초기화한다. -->

    <title>수북 SUBOOK | 수능 교재 구매·위탁판매</title>
    <meta
      name="description"
      content="수북(SUBOOK)은 수능 교재 구매·위탁판매 플랫폼입니다. 검수된 교재를 구매하고, 안 쓰는 교재는 수거부터 판매·정산까지 맡기세요."
    />
    <!-- 구글은 keywords를 무시하지만 네이버 등 국내 검색 대비 유지 (구 식스샵 설정 이관) -->
    <meta
      name="keywords"
      content="수북, subook, 수능, 교재, 책, 중고, 대치동, 거래, 중고 거래, 중고 교재, 수능 중고 교재, 대입, 입시, 수능 교재"
    />
    <!-- 네이버 서치어드바이저 소유확인 태그 — 삭제 시 소유권 풀림, 절대 제거 금지 -->
    <meta name="naver-site-verification" content="6cd153a2d1482d0033ef63dbc700426dd61f3450" />
    <!-- 도메인 전환(식스샵→신규) SEO: 정식 도메인 기준 canonical — temp 도메인 중복 색인 방지 -->
    <link rel="canonical" href="https://subook.kr/" />

    <!-- 홈 히어로 1번 슬라이드(LCP) 선로딩 — HeroBanner의 767px 브레이크포인트와 동일하게 분기 -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/banners/hero-banner-1-mobile.webp"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/banners/hero-banner-1-desktop.webp"
      media="(min-width: 768px)"
      fetchpriority="high"
    />

    <!-- Open Graph (카카오톡 / 페이스북 등 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="수북 SUBOOK | 수능 교재 구매·위탁판매" />
    <meta
      property="og:description"
      content="수북(SUBOOK)은 수능 교재 구매·위탁판매 플랫폼입니다. 검수된 교재를 구매하고, 안 쓰는 교재는 수거부터 판매·정산까지 맡기세요."
    />
    <meta property="og:site_name" content="수북 SUBOOK" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://subook.kr/" />
    <meta property="og:image" content="https://subook.kr/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="수북 SUBOOK | 수능 교재 구매·위탁판매" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="수북 SUBOOK | 수능 교재 구매·위탁판매" />
    <meta
      name="twitter:description"
      content="수북(SUBOOK)은 수능 교재 구매·위탁판매 플랫폼입니다. 검수된 교재를 구매하고, 안 쓰는 교재는 수거부터 판매·정산까지 맡기세요."
    />
    <meta name="twitter:image" content="https://subook.kr/og-image.png" />

    <!-- Font: 본문은 LINE Seed KR로 통일. 로고는 이미지 자산으로 교체되어 별도 폰트 불필요.
         CSS @import 대신 link로 로드해 렌더 블로킹을 줄인다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/npm/@kfonts/line-seed-sans-kr/index.min.css"
    />
    <!-- Favicon (책+별) — 네이버는 절대 URL 필요. api/prerender-*.js와 동일하게 유지. -->
    <link rel="icon" type="image/png" sizes="64x64" href="https://subook.kr/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://subook.kr/apple-touch-icon.png" />
    <!-- Organization 구조화 데이터 — 브랜드 검색 결과용 (도메인은 최종 도메인 기준) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "수북 SUBOOK",
        "url": "https://subook.kr",
        "logo": "https://subook.kr/og-image.png",
        "description": "수험생을 위한 수능 교재 위탁판매 플랫폼 — 수거·검수·판매·정산까지.",
        "sameAs": [
          "https://blog.naver.com/subook_official",
          "https://instagram.com/subook.official",
          "https://pf.kakao.com/_xdhxdyn"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "email": "subook2025@gmail.com",
          "availableLanguage": "Korean"
        }
      }
    </script>
    <!-- WebSite 구조화 데이터 — '수북' 브랜드 검색어와 사이트 연관 강화 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "수북",
        "alternateName": ["SUBOOK", "수북 SUBOOK"],
        "url": "https://subook.kr"
      }
    </script>
  </head>

      </main>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
